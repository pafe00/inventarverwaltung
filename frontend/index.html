<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventarverwaltung</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Cloudbasierte Inventarverwaltung</h1>
    <p>TEKO Projektarbeit – Microsoft Azure</p>
  </header>

  <main>
    <section class="dashboard">
      <div class="card">
        <h3>Gesamt</h3>
        <p id="gesamt">0</p>
      </div>
      <div class="card">
        <h3>Verfügbar</h3>
        <p id="verfuegbar">0</p>
      </div>
      <div class="card">
        <h3>Ausgeliehen</h3>
        <p id="ausgeliehen">0</p>
      </div>
      <div class="card">
        <h3>Defekt</h3>
        <p id="defekt">0</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Gerät erfassen</h2>

      <form id="inventarForm">
        <input type="number" id="id" placeholder="ID" required />
        <input type="text" id="name" placeholder="Gerätename" required />
        <input type="text" id="kategorie" placeholder="Kategorie" required />
        <input type="text" id="hersteller" placeholder="Hersteller" />
        <input type="text" id="seriennummer" placeholder="Seriennummer" />
        <input type="text" id="standort" placeholder="Standort" required />

        <select id="status" required>
          <option value="">Status wählen</option>
          <option value="verfügbar">Verfügbar</option>
          <option value="ausgeliehen">Ausgeliehen</option>
          <option value="defekt">Defekt</option>
        </select>

        <input type="text" id="bemerkung" placeholder="Bemerkung" />

        <button type="submit">Gerät hinzufügen</button>
      </form>
    </section>

    <section class="filter-section">
      <h2>Inventarliste</h2>

      <div class="filter">
        <select id="statusFilter">
          <option value="">Alle Status</option>
          <option value="verfügbar">Verfügbar</option>
          <option value="ausgeliehen">Ausgeliehen</option>
          <option value="defekt">Defekt</option>
        </select>

        <input type="text" id="standortFilter" placeholder="Standort filtern" />

        <button onclick="ladeInventar()">Filtern</button>
        <button onclick="resetFilter()">Zurücksetzen</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Kategorie</th>
            <th>Hersteller</th>
            <th>Standort</th>
            <th>Status</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="inventarTabelle"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Azure Web App · FastAPI Backend · Inventarverwaltung</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
